// WPILib adapters for frcsim: DCMotor conversion, Pose/ChassisSpeeds/SwerveModuleState views, sim guard.
// WPILib is compileOnly: robot projects already provide it (and its natives) at runtime.

plugins {
  id 'java-library'
  id 'maven-publish'
  id 'com.diffplug.spotless'
}

description = 'frcsim WPILib adapters'

def wpilibVersion = '2026.2.1'

repositories {
  maven {
    name = 'frcmaven'
    url = 'https://frcmaven.wpi.edu/artifactory/release/'
  }
}

dependencies {
  api project(':frcsim-core')

  compileOnly "edu.wpi.first.wpimath:wpimath-java:${wpilibVersion}"
  compileOnly "edu.wpi.first.wpiunits:wpiunits-java:${wpilibVersion}"
  compileOnly "edu.wpi.first.wpiutil:wpiutil-java:${wpilibVersion}"
  compileOnly "edu.wpi.first.wpilibj:wpilibj-java:${wpilibVersion}"
  compileOnly "edu.wpi.first.hal:hal-java:${wpilibVersion}"
  // WPILib geometry classes carry Jackson annotations; javac needs the annotation classes (with -Werror)
  // to read them. 2.19.2 is the version GradleRIO 2026 resolves.
  compileOnly 'com.fasterxml.jackson.core:jackson-annotations:2.19.2'
  testCompileOnly 'com.fasterxml.jackson.core:jackson-annotations:2.19.2'

  // Tests use only pure-Java WPILib math (no WPILib natives needed).
  testImplementation "edu.wpi.first.wpimath:wpimath-java:${wpilibVersion}"
  testImplementation "edu.wpi.first.wpiunits:wpiunits-java:${wpilibVersion}"
  testImplementation "edu.wpi.first.wpiutil:wpiutil-java:${wpilibVersion}"
  // WPILib's third-party runtime dependencies (the WPILib POMs don't declare them; GradleRIO adds them).
  // Versions match what GradleRIO 2026.2.1 resolves for a robot project.
  testRuntimeOnly 'us.hebi.quickbuf:quickbuf-runtime:1.4'
  testRuntimeOnly 'org.ejml:ejml-simple:0.44.0'
  testRuntimeOnly 'com.fasterxml.jackson.core:jackson-databind:2.19.2'
  testImplementation platform('org.junit:junit-bom:6.1.3')
  testImplementation 'org.junit.jupiter:junit-jupiter'
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def nativeLibDir = rootProject.frcsimNative.libDir

tasks.named('test') {
  useJUnitPlatform()
  systemProperty 'java.library.path', nativeLibDir.absolutePath
  testLogging {
    events 'failed', 'skipped'
    exceptionFormat 'full'
  }
}

spotless {
  java {
    target 'src/**/*.java'
    googleJavaFormat('1.28.0') // D13
  }
}

publishing {
  publications {
    maven(MavenPublication) {
      artifactId = 'frcsim-wpilib'
      from components.java
    }
  }
}
