plugins {
  id 'java-library'
  id 'maven-publish'
  id 'com.diffplug.spotless'
}

description = 'frcsim core Java API. Has no WPILib dependency.'

dependencies {
  testImplementation platform('org.junit:junit-bom:6.1.3')
  testImplementation 'org.junit.jupiter:junit-jupiter'
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def nativeLibDir = rootProject.frcsimNative.libDir

tasks.named('test') {
  useJUnitPlatform()
  systemProperty 'java.library.path', nativeLibDir.absolutePath
  systemProperty 'frcsim.expectedVersion', project.version
  systemProperty 'frcsim.repoDir', rootProject.file('..').absolutePath
  testLogging {
    events 'failed', 'skipped'
    exceptionFormat 'full'
  }
  doFirst {
    if (!nativeLibDir.isDirectory()) {
      throw new GradleException(
          "frcsim native library directory not found: ${nativeLibDir}\n" +
          "Build and install the native core first (see docs/building.md), " +
          "or pass -Pfrcsim.nativeInstallRoot=<dir>.")
    }
  }
}

spotless {
  java {
    target 'src/**/*.java'
    // 1.28.0 is the newest google-java-format that runs on JDK 17 (1.29.0+ requires JDK 21), and
    // Gradle runs on the WPILib 2026 JDK 17.
    googleJavaFormat('1.28.0')
  }
}

publishing {
  publications {
    maven(MavenPublication) {
      artifactId = 'frcsim-java'
      from components.java
    }
  }
}
